<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Routebase</title>
  <!-- Fontes Google: Plus Jakarta Sans e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Importação CSS com caminho relativo exato -->
  <link rel="stylesheet" href="../estilos/login.css">
</head>
<body>

  <!-- Ilustrações orgânicas decorativas nos cantos -->
  <img src="../assets/images/folha_ilustracao.png" alt="" aria-hidden="true" class="decor-leaf decor-top-left">
  <img src="../assets/images/samambaia_ilustracao.png" alt="" aria-hidden="true" class="decor-leaf decor-bottom-right">

  <main class="auth-wrapper">
    <!-- Cabeçalho Centralizado com Logo -->
    <header class="auth-header">
      <a href="../index.html" class="brand-link" aria-label="Voltar para a página inicial do Routebase">
        <img src="../assets/images/logo.png" alt="Logo Routebase" class="brand-logo">
        
      </a>
    </header>

    <!-- Cartão Central de Login -->
    <section class="auth-card" aria-labelledby="loginHeading">
      <h1 id="loginHeading" class="card-title">Acessar Sua Rota</h1>

      <form id="loginForm" class="auth-form" novalidate>
        <!-- Campo 1: Nome Completo -->
        <div class="form-group">
          <label for="nomeInput">Seu Nome Completo</label>
          <input
            type="text"
            id="nomeInput"
            name="nome"
            placeholder="João da Silva"
            autocomplete="name"
            required
          >
          <span class="field-error" id="nomeError" aria-live="polite"></span>
        </div>

        <!-- Campo 2: Melhor E-mail -->
        <div class="form-group">
          <label for="emailInput">Seu Melhor E-Mail</label>
          <input
            type="email"
            id="emailInput"
            name="email"
            placeholder="joao@email.com"
            autocomplete="email"
            required
          >
          <span class="field-error" id="emailError" aria-live="polite"></span>
        </div>

        <!-- Alerta de Feedback (Erro ou Sucesso) dentro do cartão -->
        <div class="alert-box" id="alertBox" role="alert" aria-live="assertive"></div>

        <!-- Botão Principal em formato pílula -->
        <button type="submit" class="btn-submit" id="submitBtn">
          Entrar Agora
        </button>
      </form>

      <!-- Rodapé do Cartão -->
      <footer class="card-footer">
        <p>
          Ainda não tem uma conta?
          <a href="cadastro.html" class="register-link">Criar agora</a>
        </p>
      </footer>
    </section>
  </main>

  <!-- Importação JS com caminho relativo exato -->
  <script src="../javascript/login.js"></script>
</body>
</html>
